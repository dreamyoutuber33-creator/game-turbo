name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Could not detect active Java version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Active Java major version must be 17 or higher. Found: $JAVA_MAJOR"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Debug keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "Debug keystore already exists."
          fi

          if [ ! -f ./debug.keystore ]; then
            echo "::error::Temporary debug keystore could not be created."
            exit 1
          fi
          echo "Debug keystore confirmed."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            echo "Listing files inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Debug APK at $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::$EXPECTED_APK does not have a .apk extension."
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Selected APK does not exactly match app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "APK successfully verified at: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RUNNER_TMP_DIR=$(mktemp -d "${RUNNER_TEMP}/apk-release-asset-XXXXXX")
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SANITIZED_REPO_NAME=$(echo "$REPO_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          ASSET_NAME="${SANITIZED_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${RUNNER_TMP_DIR}/${ASSET_NAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi

          echo "Asset path: $ASSET_PATH"
          echo "Asset name: $ASSET_NAME"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset does not exist or is empty: $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Prepared asset is not a valid .apk file: $ASSET_PATH"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES="### Debug APK Build #${GITHUB_RUN_NUMBER}

- **Build Type:** Automatically generated debug APK
- **Built By:** GitHub Actions
- **Run Number:** ${GITHUB_RUN_NUMBER}
- **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
- **Source Commit:** ${GITHUB_SHA}
- **Purpose:** Intended for testing only
- **Production Status:** Not a Play Store production release
- **Signing:** Signed only with a temporary debug keystore"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_STATUS="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "GitHub Release published successfully."
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            {
              echo "## :white_check_mark: Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **APK Filename:** \`${ASSET_NAME}\`"
              echo "- **Direct Download URL:** [View GitHub Release](${RELEASE_URL})"
              echo ""
              echo "The debug APK can be downloaded directly on your phone from the release **Assets** section."
              echo "The normal Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was not completed (outcome: $RELEASE_STATUS)."
            echo "APK build succeeded and the Actions artifact 'app-debug-apk' remains available."

            {
              echo "## :warning: Debug APK Build Succeeded"
              echo ""
              echo "The debug APK was successfully built and preserved as an Actions artifact."
              echo "- **Artifact Name:** \`app-debug-apk\`"
              echo "- **Release Status:** Publishing encountered an issue or permission restriction."
              echo "- The APK can be downloaded from the **Artifacts** section of this GitHub Actions run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
